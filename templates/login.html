<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudShield Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            font-family:'Inter',sans-serif;
        }

        body{
            background:#f4f7fb;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .login-card{
            width:420px;
            background:white;
            padding:40px;
            border-radius:28px;
            box-shadow:0 10px 30px rgba(15,23,42,0.08);
        }

        .brand{
            text-align:center;
            font-size:34px;
            font-weight:700;
            color:#0f172a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#6b7280;
            margin-bottom:35px;
        }

        .form-label{
            font-weight:600;
            margin-bottom:10px;
        }

        .form-control{
            border-radius:14px;
            padding:14px;
            margin-bottom:20px;
            border:1px solid #d1d5db;
        }

        .btn-login{
            width:100%;
            background:#2563eb;
            border:none;
            padding:15px;
            border-radius:14px;
            color:white;
            font-weight:600;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#1d4ed8;
        }

        .alert-danger{
            border-radius:14px;
        }

    </style>
</head>
<body>

<div class="login-card">

    <div class="brand">
        🛡 FraudShield AI
    </div>

    <div class="subtitle">
        Analyst Authentication Portal
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username">

        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password">

        <button type="submit" class="btn-login">
            Login to Dashboard
        </button>

    </form>

</div>

</body>
</html>
